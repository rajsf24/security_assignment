name: Secure CI Pipeline

on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ledger-api
  IMAGE_TAG: latest

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build and Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python Installation
        run: python --version

      - name: Install Dependencies
        run: |
          cd app
          pip install -r requirements.txt
      
      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config auto \
            app/

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ./app

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Display Image Reference
        run: |
          echo "Image pushed successfully:"
          echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          scanners: vuln
          exit-code: "0"
          severity: CRITICAL,HIGH


      - name: List Docker Images
        run: docker images

      - name: Verify Application Files
        run: |
          cd app
          ls -la

      - name: Pipeline Completed
        run: echo "Application validation completed successfully!"
